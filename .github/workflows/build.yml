name: Build

on:
  pull_request:

# Build only. No registry credentials are referenced anywhere in this file, so
# a pull request from a fork runs it exactly like one from a branch - which is
# the point: the Travis config referenced $DOCKER_USER during build and so
# could never pass for a fork contributor.
permissions: {}

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      # amd64 only, deliberately. The Dockerfile pins the docker apt repo to
      # [arch=amd64], so an arm64 build cannot resolve docker-ce and fails.
      # Removing that engine install is tracked in #10; add linux/arm64 here
      # and in release.yml once it lands.
      #
      # Loaded into the daemon so the next step can actually run it. This tests
      # THIS commit's image; the Travis job pulled the published image from
      # Docker Hub instead, so no pull request was ever validated against its
      # own build.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: local/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: playground:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and require a healthy login page
        run: |
          set -euo pipefail
          docker run -d --name playground -p 8080:8080 playground:ci
          # -f so a 4xx/5xx fails the job. The Travis check omitted it, which
          # meant any response at all counted as success.
          if ! curl -fsS --retry 20 --retry-delay 3 --retry-all-errors \
                 -o /dev/null http://127.0.0.1:8080/login
          then
            echo "::error::code-server did not serve /login" >&2
            exit 1
          fi
          echo "code-server served /login"

      - name: Container logs on failure
        if: failure()
        run: docker logs playground || true

      - name: Stop container
        if: always()
        run: docker rm -f playground || true
